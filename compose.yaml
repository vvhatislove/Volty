services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      DATABASE_URL: postgresql+asyncpg://volty:${POSTGRES_PASSWORD:?}@db:5432/volty
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: volty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: volty
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volty -d volty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
